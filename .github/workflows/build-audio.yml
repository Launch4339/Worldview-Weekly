name: Build Worldview Weekly Audio

on:
  push:
    branches: [main]
    paths:
      - 'audio/current.txt'
      - 'scripts/build_audio.py'
      - '.github/workflows/build-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install 'kokoro>=0.9.4' soundfile numpy

      - name: Build audio and podcast RSS
        env:
          KOKORO_VOICE: af_heart
          KOKORO_SPEED: '1.0'
        run: python scripts/build_audio.py

      - name: Commit generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/episodes podcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "Publish Worldview Weekly audio"
          git push
